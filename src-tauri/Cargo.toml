[package]
name = "media-organizer"
version = "0.2.0"
description = "Organize NAS media TODO folder"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
flate2 = "1"
iana-time-zone = "0.1"
log = "0.4.34"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLLocationManager"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSRunLoop"] }

[dev-dependencies]
tempfile = "3"
ts-rs = "12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
