name: Release

# Each push to main publishes the next patch version as the latest release.
# Run the workflow by hand to bump the minor or major version instead.
# Asset names carry the version. install.sh and install.ps1 read the latest tag to build them.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "specs/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Releases run one at a time, so each one sees the tag of the one before.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh "${{ inputs.bump || 'patch' }}")" >> "$GITHUB_OUTPUT"

      # A tag pushed with the workflow token starts no other workflow.
      # A pre-release shows each asset as soon as its job uploads it.
      # releases/latest skips pre-releases, so the install scripts keep the last full release.
      - name: Tag the commit and create a pre-release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --generate-notes --title "Media Organizer $TAG"

  build:
    needs: create-release
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            suffix: windows-x64-setup.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            suffix: macos-aarch64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            suffix: macos-x86_64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise x -- rustup target add ${{ matrix.target }}
      # Reuses compiled dependencies from the last run, so only the app crate builds again.
      # The runner image brings its own Rust, so the key follows mise.toml and Cargo.lock instead.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}-${{ hashFiles('mise.toml', 'src-tauri/Cargo.lock') }}
          add-rust-environment-hash-key: false
      - run: mise x -- pnpm install --frozen-lockfile
      - run: echo "ASSET=MediaOrganizer-${TAG#v}-${{ matrix.suffix }}" >> "$GITHUB_ENV"
      - run: mise x -- pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config "{\"version\":\"${TAG#v}\"}"

      - name: Package the Windows installer
        if: runner.os == 'Windows'
        run: cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe "$ASSET"

      - name: Package the macOS disk image
        if: runner.os == 'macOS'
        run: cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "$ASSET"

      - run: gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    needs: create-release
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          export ANDROID_VERSION_NAME="${TAG#v}"
          # v1.2.3 becomes 1002003. Android refuses an update with a lower code.
          ANDROID_VERSION_CODE=$(echo "$ANDROID_VERSION_NAME" | awk -F. '{ print $1 * 1000000 + $2 * 1000 + $3 }')
          export ANDROID_VERSION_CODE
          ./android/build-apk.sh
          cp android/dist/media-organizer.apk "MediaOrganizer-$ANDROID_VERSION_NAME-android.apk"

      - run: gh release upload "$TAG" "MediaOrganizer-${TAG#v}-android.apk" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [create-release, build, android]
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark the release as latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
