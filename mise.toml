[tools]
# A fixed version keeps the CI Rust cache valid. "stable" resolved to different versions per runner.
rust = "1.99.1"
node = "latest"
pnpm = "latest"

[tasks.versions]
description = "Show the active project tool versions"
run = [
  "rustc --version",
  "cargo --version",
  "node --version",
  "pnpm --version"
]
